name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30 richiede Node ^22.22.2 || ^24.15.0 || >=26.0.0 (vedi
          # node_modules/jsdom/package.json): con Node 20 npm test fallisce
          # subito con "webidl.util.markAsUncloneable is not a function"
          # dentro undici, non è un vero fallimento dei test.
          node-version: 22.22.2

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegue i test
        run: npm test

      - name: Verifica DA_TENERE e VERSIONE in sw.js
        env:
          VERIFICA_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '') }}
        run: node scripts/verifica-da-tenere.js
